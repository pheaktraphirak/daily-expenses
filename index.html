<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Daily Expenses</title>

  <!-- iOS Standalone Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Expenses" />
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/wallet--v1.png" />

  <style>
    :root {
      --pine: #2F5D50;
      --pine-dark: #204239;
      --pine-subtle: rgba(47, 93, 80, 0.08);
      --pine-glow: rgba(47, 93, 80, 0.22);
      --bg: #F8F9FA;
      --card-bg: #FFFFFF;
      --text: #1C1C1E;
      --secondary: #6E6E73;
      --border: rgba(0, 0, 0, 0.06);
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02);
      --danger: #FF3B30;
      --danger-subtle: rgba(255, 59, 48, 0.1);
      --warning: #FF9500;
      --success: #34C759;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --card-bg: #1C1C1E;
        --text: #F2F2F7;
        --secondary: #8E8E93;
        --border: rgba(255, 255, 255, 0.08);
        --card-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
        --pine-subtle: rgba(47, 93, 80, 0.22);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 95px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(248, 249, 250, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: calc(env(safe-area-inset-top) + 12px) 18px 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid var(--border);
    }
    @media (prefers-color-scheme: dark) {
      header { background: rgba(18, 18, 20, 0.85); }
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header-actions { display: flex; gap: 8px; }
    .pill-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--pine);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.15s ease;
    }
    .pill-btn:active { transform: scale(0.95); }

    .container {
      padding: 16px 18px;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Personality & Budget Card */
    .personality-card {
      background: linear-gradient(135deg, var(--card-bg) 0%, var(--pine-subtle) 100%);
      border-radius: 22px;
      padding: 18px 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .coach-header { display: flex; justify-content: space-between; align-items: center; }
    .coach-greeting { font-size: 13px; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px; }
    .coach-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(52, 199, 89, 0.15);
      color: var(--success);
    }
    .coach-badge.warning { background: rgba(255, 149, 0, 0.15); color: var(--warning); }
    .coach-badge.over { background: var(--danger-subtle); color: var(--danger); }
    .coach-quote { font-size: 16px; font-weight: 700; line-height: 1.35; margin: 0; }
    .progress-bar-bg {
      height: 8px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 4px;
    }
    @media (prefers-color-scheme: dark) {
      .progress-bar-bg { background: rgba(255, 255, 255, 0.1); }
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--pine);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 3 Summary Badges */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.15s ease;
    }
    .stat-card:active { transform: scale(0.98); }
    .stat-label { font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.6px; }
    .stat-value { font-size: 20px; font-weight: 800; font-family: -apple-system-headline, monospace; color: var(--pine); }

    /* Content Cards */
    .content-card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--card-shadow);
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Last 7 Days Interactive Chart */
    .chart-box {
      display: flex;
      align-items: flex-end;
      height: 140px;
      gap: 10px;
      padding-top: 10px;
    }
    .chart-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      cursor: pointer;
    }
    .chart-bar-bg {
      width: 100%;
      background: var(--pine-subtle);
      border-radius: 10px;
      display: flex;
      align-items: flex-end;
      height: 100px;
    }
    .chart-bar-fill {
      width: 100%;
      background: linear-gradient(180deg, #448070 0%, var(--pine) 100%);
      border-radius: 10px;
      min-height: 6px;
      transition: height 0.35s ease;
    }
    .chart-day { font-size: 11px; font-weight: 600; margin-top: 6px; color: var(--secondary); }

    /* Expense List & Search */
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }
    .expense-item {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 0.5px solid var(--border);
    }
    .expense-item:last-child { border-bottom: none; }
    .cat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .expense-details { flex: 1; }
    .expense-name { font-weight: 700; font-size: 15px; }
    .expense-meta { font-size: 12px; color: var(--secondary); margin-top: 2px; }
    .expense-cost { font-size: 16px; font-weight: 800; font-family: monospace; text-align: right; }
    .receipt-badge {
      font-size: 11px;
      color: var(--pine);
      font-weight: 600;
      margin-top: 2px;
      display: block;
      cursor: pointer;
    }
    .btn-delete {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 16px;
      padding: 6px 10px;
      cursor: pointer;
      border-radius: 8px;
    }
    .btn-delete:active { background: var(--danger-subtle); }

    /* Floating Add Button */
    .fab {
      position: fixed;
      right: 20px;
      bottom: 84px;
      width: 60px;
      height: 60px;
      border-radius: 30px;
      background: var(--pine);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 300;
      box-shadow: 0 8px 24px var(--pine-glow);
      border: none;
      cursor: pointer;
      z-index: 30;
      transition: transform 0.15s ease, background-color 0.2s;
    }
    .fab:active { transform: scale(0.92); background: var(--pine-dark); }

    /* Tab Bar */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(248, 249, 250, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 calc(env(safe-area-inset-bottom) + 8px) 0;
      border-top: 0.5px solid var(--border);
      z-index: 25;
    }
    @media (prefers-color-scheme: dark) {
      nav { background: rgba(18, 18, 20, 0.88); }
    }
    .nav-tab {
      background: none;
      border: none;
      color: var(--secondary);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .nav-tab.active { color: var(--pine); font-weight: 700; }
    .nav-tab svg { width: 22px; height: 22px; fill: currentColor; }

    /* Modal / Bottom Sheet */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 40;
    }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      border-radius: 28px 28px 0 0;
      padding: 20px 20px calc(env(safe-area-inset-bottom) + 24px) 20px;
      box-sizing: border-box;
      max-height: 92vh;
      overflow-y: auto;
      animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Modal Inputs & Category Grid */
    .form-group { margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 700; color: var(--secondary); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .amount-wrapper {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 6px 14px;
    }
    .cur-pill {
      background: var(--pine);
      color: #fff;
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }
    .amount-input {
      width: 100%;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 32px;
      font-weight: 800;
      font-family: monospace;
      outline: none;
    }

    /* Quick Amount Chips */
    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 2px 0;
    }
    .chip {
      background: var(--pine-subtle);
      color: var(--pine);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .chip:active { transform: scale(0.94); }

    /* Category 4x2 Grid */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 6px;
    }
    .category-card {
      background: var(--bg);
      border: 1.5px solid transparent;
      border-radius: 16px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .category-card:active { transform: scale(0.95); }
    .category-card.selected {
      border-color: var(--pine);
      background: var(--pine-subtle);
    }
    .category-emoji { font-size: 26px; }
    .category-title { font-size: 11px; font-weight: 700; text-align: center; }

    /* Quick Date Selector */
    .date-pills { display: flex; gap: 8px; margin-bottom: 8px; }
    .date-pill {
      flex: 1;
      padding: 8px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .date-pill.active { background: var(--pine); color: #fff; border-color: var(--pine); }

    .btn-action {
      width: 100%;
      padding: 16px;
      background: var(--pine);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--pine-glow);
    }
    .btn-action:active { transform: scale(0.98); }
    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--secondary);
      font-size: 14px;
      font-weight: 600;
      margin-top: 6px;
      cursor: pointer;
    }

    /* Empty State Illustration */
    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--secondary);
    }
    .empty-emoji { font-size: 46px; margin-bottom: 8px; }
    .empty-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div>
      <h1 id="headerTitle">Daily Expenses</h1>
      <div id="liveDate" style="font-size: 12px; color: var(--secondary); font-weight: 600;"></div>
    </div>
    <div class="header-actions">
      <button class="pill-btn" onclick="toggleLanguage()" id="langBtn">🇰🇭 ភាសាខ្មែរ</button>
      <button class="pill-btn" onclick="toggleCurrency()" id="curBtn">USD ($)</button>
    </div>
  </header>

  <div class="container">
    <!-- Tab 1: Dashboard -->
    <div id="tabDashboard">
      <!-- Friendly Budget & Status Card -->
      <div class="personality-card">
        <div class="coach-header">
          <span class="coach-greeting" id="coachGreeting">STATUS</span>
          <span class="coach-badge" id="coachBadge">On Track 🌿</span>
        </div>
        <p class="coach-quote" id="coachQuote">Your finances are looking healthy today!</p>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="budgetProgress" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Quick Summary Cards -->
      <div class="summary-grid">
        <div class="stat-card" onclick="switchTab('entries')">
          <span class="stat-label" id="lblToday">TODAY</span>
          <span class="stat-value" id="valToday">$0.00</span>
        </div>
        <div class="stat-card" onclick="switchTab('entries')">
          <span class="stat-label" id="lblMonth">THIS MONTH</span>
          <span class="stat-value" id="valMonth">$0.00</span>
        </div>
      </div>

      <!-- Last 7 Days Graph -->
      <div class="content-card">
        <div class="card-title">
          <span id="lblLast7Days">Last 7 Days</span>
          <span style="font-size: 11px; text-transform: none; color: var(--pine);" id="lblWeekAvg">Tap bars to view</span>
        </div>
        <div class="chart-box" id="barChart"></div>
      </div>

      <!-- Categories Breakdown -->
      <div class="content-card">
        <div class="card-title" id="lblCategories">Top Spending Categories</div>
        <div id="categoryBreakdown"></div>
      </div>

      <!-- Data Export Options -->
      <div class="content-card">
        <div class="card-title" id="lblData">Data & Tools</div>
        <div style="display: flex; gap: 10px;">
          <button class="pill-btn" style="flex:1; justify-content:center; padding:12px;" onclick="exportCSV()">📄 Export CSV</button>
          <button class="pill-btn" style="flex:1; justify-content:center; padding:12px;" onclick="backupJSON()">📦 Backup JSON</button>
        </div>
      </div>
    </div>

    <!-- Tab 2: Entries List -->
    <div id="tabEntries" style="display: none;">
      <div class="content-card">
        <input type="search" class="search-input" id="searchBar" placeholder="🔍 Search by note or category..." oninput="filterEntries()" />
        <div id="entriesList"></div>
      </div>
    </div>

    <!-- Tab 3: Settings -->
    <div id="tabSettings" style="display: none;">
      <div class="content-card">
        <div class="card-title" id="lblSettings">Settings</div>
        <div class="form-group">
          <label id="lblExRate">Exchange Rate (1 USD = ? KHR)</label>
          <input type="number" id="settingRate" value="4035" class="search-input" onchange="updateRate(this.value)" />
        </div>
        <div class="form-group">
          <label id="lblBudgetSet">Monthly Budget (USD)</label>
          <input type="number" id="settingBudget" placeholder="e.g. 500" class="search-input" onchange="updateBudget(this.value)" />
        </div>
        <button class="btn-action" style="background: var(--danger); box-shadow: 0 4px 14px var(--danger-subtle); margin-top: 14px;" onclick="clearAllData()">Reset All Data</button>
      </div>
    </div>
  </div>

  <!-- Floating Add Button -->
  <button class="fab" onclick="openAddModal()">+</button>

  <!-- Bottom Navigation -->
  <nav>
    <button class="nav-tab active" onclick="switchTab('dashboard')" id="navDash">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      <span id="tabNameDash">Dashboard</span>
    </button>
    <button class="nav-tab" onclick="switchTab('entries')" id="navEntries">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      <span id="tabNameEntries">Entries</span>
    </button>
    <button class="nav-tab" onclick="switchTab('settings')" id="navSettings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      <span id="tabNameSettings">Settings</span>
    </button>
  </nav>

  <!-- Friendly 1-Tap Add Expense Modal -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin: 0; font-size: 20px; font-weight: 800;" id="lblAddTitle">Add Expense</h2>
        <button onclick="closeAddModal()" style="background: none; border: none; font-size: 20px; color: var(--secondary); cursor: pointer;">✕</button>
      </div>

      <!-- Amount + Currency Pill -->
      <div class="form-group">
        <label id="lblAmount">Amount</label>
        <div class="amount-wrapper">
          <button type="button" class="cur-pill" id="btnModalCur" onclick="toggleFormCurrency()">USD ($)</button>
          <input type="number" id="inpAmount" class="amount-input" placeholder="0.00" step="any" inputmode="decimal" />
        </div>
        <!-- Quick Pick Chips -->
        <div class="chip-row" id="quickChips"></div>
      </div>

      <!-- 1-Tap Category Grid -->
      <div class="form-group">
        <label id="lblCategory">Select Category</label>
        <div class="category-grid" id="categoryGrid"></div>
      </div>

      <!-- Date Pills -->
      <div class="form-group">
        <label id="lblDate">When</label>
        <div class="date-pills">
          <button type="button" class="date-pill active" id="pillToday" onclick="selectDatePill('today')">Today</button>
          <button type="button" class="date-pill" id="pillYesterday" onclick="selectDatePill('yesterday')">Yesterday</button>
          <button type="button" class="date-pill" id="pillCustom" onclick="selectDatePill('custom')">Custom</button>
        </div>
        <input type="date" id="inpDate" class="search-input" style="display: none; margin-top: 6px;" />
      </div>

      <!-- Note & Optional Receipt -->
      <div class="form-group">
        <label id="lblNote">Note & Receipt</label>
        <input type="text" id="inpNote" class="search-input" placeholder="e.g. Iced Latte with friends" />
        <input type="file" id="inpReceipt" accept="image/*" style="font-size: 12px; margin-top: 4px;" />
      </div>

      <button class="btn-action" onclick="saveExpense()" id="btnSave">Save Expense</button>
      <button class="btn-secondary" onclick="closeAddModal()" id="btnCancel">Cancel</button>
    </div>
  </div>

  <script>
    // Categories with Emojis[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span)
    const categories = [
      { id: "food", emoji: "🍜", labelEn: "Food", labelKm: "អាហារ", color: "#B8862B" },
      { id: "drinks", emoji: "☕", labelEn: "Drinks", labelKm: "ភេសជ្ជៈ", color: "#1F7A72" },
      { id: "transport", emoji: "🛵", labelEn: "Transport", labelKm: "ធ្វើដំណើរ", color: "#2F5D50" },
      { id: "shopping", emoji: "🛍️", labelEn: "Shopping", labelKm: "ទិញទំនិញ", color: "#4D6A82" },
      { id: "bills", emoji: "💡", labelEn: "Bills", labelKm: "វិក្កយបត្រ", color: "#9C3D2E" },
      { id: "health", emoji: "💊", labelEn: "Health", labelKm: "សុខភាព", color: "#4E7A63" },
      { id: "fun", emoji: "🎮", labelEn: "Fun", labelKm: "កម្សាន្ត", color: "#8B5E83" },
      { id: "other", emoji: "📦", labelEn: "Other", labelKm: "ផ្សេងទៀត", color: "#6E6A5E" }
    ];

    // Bilingual Khmer & English dictionary[span_5](start_span)[span_5](end_span)
    const i18n = {
      dashboard: { en: "Dashboard", km: "ផ្ទាំងគ្រប់គ្រង" },
      entries: { en: "Entries", km: "ចំណាយទាំងអស់" },
      settings: { en: "Settings", km: "ការកំណត់" },
      spent_today: { en: "TODAY", km: "ថ្ងៃនេះ" },
      spent_this_month: { en: "THIS MONTH", km: "ខែនេះ" },
      last_7_days: { en: "Last 7 Days", km: "៧ ថ្ងៃចុងក្រោយ" },
      categories: { en: "Top Categories", km: "ចំណាត់ថ្នាក់ចំណាយ" },
      data: { en: "Data & Tools", km: "ទិន្នន័យ" },
      add_title: { en: "Add Expense", km: "បន្ថែមចំណាយ" },
      amount: { en: "Amount", km: "ចំនួនទឹកប្រាក់" },
      category: { en: "Select Category", km: "ជ្រើសរើសប្រភេទ" },
      date: { en: "When", km: "កាលបរិច្ឆេទ" },
      note: { en: "Note & Receipt", km: "កំណត់ចំណាំ & បង្កាន់ដៃ" },
      save: { en: "Save Expense", km: "រក្សាទុកចំណាយ" },
      cancel: { en: "Cancel", km: "បោះបង់" },
      today: { en: "Today", km: "ថ្ងៃនេះ" },
      yesterday: { en: "Yesterday", km: "ម្សិលមិញ" },
      custom: { en: "Custom", km: "ជ្រើសរើស" },
      ex_rate: { en: "Exchange Rate (1 USD = ? KHR)", km: "អត្រាប្តូរប្រាក់ (1 USD = ? ៛)" },
      budget: { en: "Monthly Budget (USD)", km: "ថវិកាប្រចាំខែ (USD)" }
    };

    // Global Store[span_6](start_span)[span_6](end_span)
    let state = {
      entries: JSON.parse(localStorage.getItem("ledger_entries") || "[]"),
      exchangeRate: parseFloat(localStorage.getItem("ledger_rate") || "4035"),
      displayCurrency: localStorage.getItem("ledger_cur") || "USD",
      monthlyBudgetUSD: parseFloat(localStorage.getItem("ledger_budget") || "0"),
      lang: localStorage.getItem("ledger_lang") || "en",
      activeFormCur: "USD",
      selectedCat: "food",
      receiptBase64: null
    };

    window.addEventListener("DOMContentLoaded", () => {
      updateLiveDate();
      buildCategoryGrid();
      applyLanguage();
      render();
    });

    function saveState() {
      localStorage.setItem("ledger_entries", JSON.stringify(state.entries));
      localStorage.setItem("ledger_rate", state.exchangeRate);
      localStorage.setItem("ledger_cur", state.displayCurrency);
      localStorage.setItem("ledger_budget", state.monthlyBudgetUSD);
      localStorage.setItem("ledger_lang", state.lang);
      render();
    }

    // Currency Formatting[span_7](start_span)[span_7](end_span)
    function toUSD(val, cur) {
      return cur === "KHR" ? val / state.exchangeRate : val;
    }
    function fromUSD(valUSD, cur) {
      return cur === "KHR" ? valUSD * state.exchangeRate : valUSD;
    }
    function fmt(val, cur = state.displayCurrency) {
      const sym = cur === "KHR" ? "៛" : "$";
      if (cur === "KHR") {
        return sym + Math.round(val).toLocaleString();
      }
      return sym + val.toFixed(2);
    }

    function updateLiveDate() {
      const now = new Date();
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      document.getElementById("liveDate").innerText = now.toLocaleDateString(state.lang === "km" ? "km-KH" : "en-US", options);
    }

    // Render Dashboard & UI[span_8](start_span)[span_8](end_span)
    function render() {
      const now = new Date();
      const todayStr = now.toISOString().split("T")[0];
      const curYear = now.getFullYear();
      const curMonth = now.getMonth();

      let todayUSD = 0;
      let monthUSD = 0;
      let catMap = {};

      state.entries.forEach(e => {
        const eDate = new Date(e.date);
        const costUSD = toUSD(e.amount, e.currency);

        if (e.date.startsWith(todayStr)) todayUSD += costUSD;
        if (eDate.getFullYear() === curYear && eDate.getMonth() === curMonth) {
          monthUSD += costUSD;
          catMap[e.categoryId] = (catMap[e.categoryId] || 0) + costUSD;
        }
      });

      // Update Summary Cards[span_9](start_span)[span_9](end_span)
      document.getElementById("valToday").innerText = fmt(fromUSD(todayUSD, state.displayCurrency));
      document.getElementById("valMonth").innerText = fmt(fromUSD(monthUSD, state.displayCurrency));

      // Update Personality Budget Coach
      updatePersonalityCard(monthUSD);

      // Render Last 7 Days Bars[span_10](start_span)[span_10](end_span)
      renderWeeklyChart();

      // Render Categories
      renderCategoryList(catMap, monthUSD);

      // Render Entries Tab
      renderEntriesList();

      document.getElementById("curBtn").innerText = state.displayCurrency === "USD" ? "USD ($)" : "KHR (៛)";
      document.getElementById("settingRate").value = state.exchangeRate;
      document.getElementById("settingBudget").value = state.monthlyBudgetUSD || "";
    }

    function updatePersonalityCard(monthUSD) {
      const progressEl = document.getElementById("budgetProgress");
      const badgeEl = document.getElementById("coachBadge");
      const quoteEl = document.getElementById("coachQuote");

      if (state.monthlyBudgetUSD > 0) {
        const pct = Math.min((monthUSD / state.monthlyBudgetUSD) * 100, 100);
        progressEl.style.width = pct + "%";

        if (pct < 60) {
          badgeEl.className = "coach-badge";
          badgeEl.innerText = "Great Pace 🌿";
          quoteEl.innerText = `You've used ${pct.toFixed(0)}% of your monthly budget. Looking healthy!`;
        } else if (pct <= 90) {
          badgeEl.className = "coach-badge warning";
          badgeEl.innerText = "Careful 📊";
          quoteEl.innerText = `You've reached ${pct.toFixed(0)}% of your budget. Spend wisely!`;
        } else {
          badgeEl.className = "coach-badge over";
          badgeEl.innerText = "Over Limit ⚠️";
          quoteEl.innerText = `Budget exceeded by ${fmt(fromUSD(monthUSD - state.monthlyBudgetUSD, state.displayCurrency))}!`;
        }
      } else {
        progressEl.style.width = "25%";
        badgeEl.className = "coach-badge";
        badgeEl.innerText = "Active ✨";
        quoteEl.innerText = "Logging expenses daily keeps your finances crystal clear!";
      }
    }

    // Weekly Chart with Rounded Bars[span_11](start_span)[span_11](end_span)
    function renderWeeklyChart() {
      const container = document.getElementById("barChart");
      container.innerHTML = "";
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push(d);
      }

      let totals = days.map(d => {
        const dStr = d.toISOString().split("T")[0];
        const sumUSD = state.entries
          .filter(e => e.date.startsWith(dStr))
          .reduce((acc, e) => acc + toUSD(e.amount, e.currency), 0);
        return { date: d, amount: fromUSD(sumUSD, state.displayCurrency) };
      });

      const maxVal = Math.max(...totals.map(d => d.amount), 1);

      totals.forEach(item => {
        const col = document.createElement("div");
        col.className = "chart-col";
        const heightPct = Math.max((item.amount / maxVal) * 100, 6);
        const dayName = item.date.toLocaleDateString(state.lang === "km" ? "km-KH" : "en-US", { weekday: "short" });

        col.innerHTML = `
          <div class="chart-bar-bg">
            <div class="chart-bar-fill" style="height: ${heightPct}%;"></div>
          </div>
          <div class="chart-day">${dayName}</div>
        `;
        col.onclick = () => {
          alert(`${dayName}: ${fmt(item.amount)} spent`);
        };
        container.appendChild(col);
      });
    }

    // Category Breakdown[span_12](start_span)[span_12](end_span)[span_13](start_span)[span_13](end_span)
    function renderCategoryList(catMap, monthUSD) {
      const container = document.getElementById("categoryBreakdown");
      container.innerHTML = "";
      const sortedKeys = Object.keys(catMap).sort((a, b) => catMap[b] - catMap[a]);

      if (sortedKeys.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-emoji">☕</div><div class="empty-title">No spending yet this month</div><div style="font-size:12px;">Tap the + button to add your first expense!</div></div>`;
        return;
      }

      sortedKeys.forEach(catId => {
        const cat = categories.find(c => c.id === catId) || { emoji: "📦", labelEn: catId, labelKm: catId, color: "#999" };
        const amt = fromUSD(catMap[catId], state.displayCurrency);
        const pct = monthUSD > 0 ? ((catMap[catId] / monthUSD) * 100).toFixed(0) : 0;
        const name = state.lang === "km" ? cat.labelKm : cat.labelEn;

        const row = document.createElement("div");
        row.className = "expense-item";
        row.innerHTML = `
          <div class="cat-avatar" style="background:${cat.color}1A; color:${cat.color}">${cat.emoji}</div>
          <div class="expense-details">
            <div class="expense-name">${name}</div>
            <div class="expense-meta">${pct}% of this month</div>
          </div>
          <div class="expense-cost">${fmt(amt)}</div>
        `;
        container.appendChild(row);
      });
    }

    // Entries Tab & Search Filter[span_14](start_span)[span_14](end_span)[span_15](start_span)[span_15](end_span)
    function renderEntriesList(filtered = null) {
      const container = document.getElementById("entriesList");
      container.innerHTML = "";
      const list = filtered || [...state.entries].sort((a, b) => new Date(b.date) - new Date(a.date));

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="empty-emoji">📝</div><div class="empty-title">No expenses found</div><div style="font-size:12px;">Your transactions will appear right here.</div></div>`;
        return;
      }

      list.forEach(e => {
        const cat = categories.find(c => c.id === e.categoryId) || { emoji: "📦", labelEn: e.categoryId, labelKm: e.categoryId, color: "#999" };
        const name = state.lang === "km" ? cat.labelKm : cat.labelEn;
        const row = document.createElement("div");
        row.className = "expense-item";
        row.innerHTML = `
          <div class="cat-avatar" style="background:${cat.color}1A; color:${cat.color}">${cat.emoji}</div>
          <div class="expense-details">
            <div class="expense-name">${name}</div>
            <div class="expense-meta">${e.date} ${e.note ? "• " + e.note : ""}</div>
            ${e.receipt ? `<span class="receipt-badge" onclick="viewReceipt('${e.id}')">📎 View Receipt</span>` : ""}
          </div>
          <div class="expense-cost">${fmt(e.amount, e.currency)}</div>
          <button class="btn-delete" onclick="deleteEntry('${e.id}')">✕</button>
        `;
        container.appendChild(row);
      });
    }

    function filterEntries() {
      const q = document.getElementById("searchBar").value.toLowerCase();
      const filtered = state.entries.filter(e => {
        const cat = categories.find(c => c.id === e.categoryId);
        const name = (cat?.labelEn + " " + cat?.labelKm).toLowerCase();
        const note = (e.note || "").toLowerCase();
        return name.includes(q) || note.includes(q);
      });
      renderEntriesList(filtered);
    }

    // 1-Tap Category Grid Generator
    function buildCategoryGrid() {
      const grid = document.getElementById("categoryGrid");
      grid.innerHTML = "";
      categories.forEach(c => {
        const card = document.createElement("div");
        card.className = "category-card" + (state.selectedCat === c.id ? " selected" : "");
        card.onclick = () => {
          document.querySelectorAll(".category-card").forEach(el => el.classList.remove("selected"));
          card.classList.add("selected");
          state.selectedCat = c.id;
        };
        const name = state.lang === "km" ? c.labelKm : c.labelEn;
        card.innerHTML = `<span class="category-emoji">${c.emoji}</span><span class="category-title">${name}</span>`;
        grid.appendChild(card);
      });
    }

    // Quick Amount Chips
    function updateQuickChips() {
      const container = document.getElementById("quickChips");
      container.innerHTML = "";
      const isUSD = state.activeFormCur === "USD";
      const values = isUSD ? [1, 2, 5, 10, 20] : [2000, 5000, 10000, 20000, 50000];

      values.forEach(v => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.innerText = isUSD ? `+$${v}` : `+${v.toLocaleString()}៛`;
        chip.onclick = () => {
          const inp = document.getElementById("inpAmount");
          inp.value = (parseFloat(inp.value || 0) + v).toFixed(isUSD ? 2 : 0);
        };
        container.appendChild(chip);
      });
    }

    // Modal Handlers[span_16](start_span)[span_16](end_span)
    function openAddModal() {
      document.getElementById("inpAmount").value = "";
      document.getElementById("inpNote").value = "";
      document.getElementById("inpReceipt").value = "";
      selectDatePill("today");
      state.activeFormCur = state.displayCurrency;
      document.getElementById("btnModalCur").innerText = state.activeFormCur === "USD" ? "USD ($)" : "KHR (៛)";
      updateQuickChips();
      document.getElementById("addModal").style.display = "flex";
    }

    function closeAddModal() {
      document.getElementById("addModal").style.display = "none";
    }

    function toggleFormCurrency() {
      state.activeFormCur = state.activeFormCur === "USD" ? "KHR" : "USD";
      document.getElementById("btnModalCur").innerText = state.activeFormCur === "USD" ? "USD ($)" : "KHR (៛)";
      updateQuickChips();
    }

    function selectDatePill(pill) {
      document.querySelectorAll(".date-pill").forEach(p => p.classList.remove("active"));
      const dateInp = document.getElementById("inpDate");

      if (pill === "today") {
        document.getElementById("pillToday").classList.add("active");
        dateInp.value = new Date().toISOString().split("T")[0];
        dateInp.style.display = "none";
      } else if (pill === "yesterday") {
        document.getElementById("pillYesterday").classList.add("active");
        const y = new Date();
        y.setDate(y.getDate() - 1);
        dateInp.value = y.toISOString().split("T")[0];
        dateInp.style.display = "none";
      } else {
        document.getElementById("pillCustom").classList.add("active");
        dateInp.style.display = "block";
      }
    }

    // Save Expense with Image Attachment[span_17](start_span)[span_17](end_span)
    async function saveExpense() {
      const amt = parseFloat(document.getElementById("inpAmount").value);
      if (!amt || amt <= 0) return alert("Please enter a valid expense amount.");

      const fileInput = document.getElementById("inpReceipt");
      let receiptData = null;
      if (fileInput.files.length > 0) {
        receiptData = await fileToBase64(fileInput.files[0]);
      }

      const item = {
        id: "exp_" + Date.now(),
        amount: amt,
        currency: state.activeFormCur,
        categoryId: state.selectedCat,
        date: document.getElementById("inpDate").value || new Date().toISOString().split("T")[0],
        note: document.getElementById("inpNote").value.trim(),
        receipt: receiptData
      };

      state.entries.unshift(item);
      saveState();
      closeAddModal();
    }

    function fileToBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.readAsDataURL(file);
      });
    }

    function viewReceipt(id) {
      const item = state.entries.find(e => e.id === id);
      if (item && item.receipt) {
        const win = window.open("");
        win.document.write(`<img src="${item.receipt}" style="max-width:100%; border-radius:12px;" />`);
      }
    }

    function deleteEntry(id) {
      if (confirm("Remove this entry?")) {
        state.entries = state.entries.filter(e => e.id !== id);
        saveState();
      }
    }

    // Settings & Language[span_18](start_span)[span_18](end_span)
    function toggleLanguage() {
      state.lang = state.lang === "en" ? "km" : "en";
      applyLanguage();
      buildCategoryGrid();
      saveState();
    }

    function applyLanguage() {
      const t = (k) => i18n[k]?.[state.lang] || k;
      document.getElementById("langBtn").innerText = state.lang === "en" ? "🇰🇭 ភាសាខ្មែរ" : "🇺🇸 English";
      document.getElementById("headerTitle").innerText = state.lang === "km" ? "សៀវភៅចំណាយ" : "Daily Expenses";
      document.getElementById("lblMonth").innerText = t("spent_this_month");
      document.getElementById("lblToday").innerText = t("spent_today");
      document.getElementById("lblLast7Days").innerText = t("last_7_days");
      document.getElementById("lblCategories").innerText = t("categories");
      document.getElementById("lblData").innerText = t("data");
      document.getElementById("tabNameDash").innerText = t("dashboard");
      document.getElementById("tabNameEntries").innerText = t("entries");
      document.getElementById("tabNameSettings").innerText = t("settings");
      document.getElementById("lblSettings").innerText = t("settings");
      document.getElementById("lblExRate").innerText = t("ex_rate");
      document.getElementById("lblBudgetSet").innerText = t("budget");
      document.getElementById("lblAddTitle").innerText = t("add_title");
      document.getElementById("lblAmount").innerText = t("amount");
      document.getElementById("lblCategory").innerText = t("category");
      document.getElementById("lblDate").innerText = t("date");
      document.getElementById("lblNote").innerText = t("note");
      document.getElementById("btnSave").innerText = t("save");
      document.getElementById("btnCancel").innerText = t("cancel");
      document.getElementById("pillToday").innerText = t("today");
      document.getElementById("pillYesterday").innerText = t("yesterday");
      document.getElementById("pillCustom").innerText = t("custom");
    }

    function toggleCurrency() {
      state.displayCurrency = state.displayCurrency === "USD" ? "KHR" : "USD";
      saveState();
    }
    function updateRate(v) {
      if (v > 0) { state.exchangeRate = parseFloat(v); saveState(); }
    }
    function updateBudget(v) {
      state.monthlyBudgetUSD = parseFloat(v) || 0;
      saveState();
    }

    // Tabs[span_19](start_span)[span_19](end_span)
    function switchTab(tab) {
      document.getElementById("tabDashboard").style.display = tab === "dashboard" ? "block" : "none";
      document.getElementById("tabEntries").style.display = tab === "entries" ? "block" : "none";
      document.getElementById("tabSettings").style.display = tab === "settings" ? "block" : "none";

      document.getElementById("navDash").className = "nav-tab " + (tab === "dashboard" ? "active" : "");
      document.getElementById("navEntries").className = "nav-tab " + (tab === "entries" ? "active" : "");
      document.getElementById("navSettings").className = "nav-tab " + (tab === "settings" ? "active" : "");
    }

    // Export & Backup[span_20](start_span)[span_20](end_span)[span_21](start_span)[span_21](end_span)[span_22](start_span)[span_22](end_span)
    function exportCSV() {
      let csv = "Date,Category,Amount,Currency,Note\n";
      state.entries.forEach(e => {
        csv += `"${e.date}","${e.categoryId}","${e.amount}","${e.currency}","${e.note || ''}"\n`;
      });
      downloadBlob(csv, `expenses_${new Date().toISOString().split("T")[0]}.csv`, "text/csv");
    }

    function backupJSON() {
      const json = JSON.stringify(state, null, 2);
      downloadBlob(json, `expenses_backup_${Date.now()}.json`, "application/json");
    }

    function downloadBlob(content, filename, mime) {
      const blob = new Blob([content], { type: mime });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
    }

    function clearAllData() {
      if (confirm("Clear all recorded expenses? This cannot be undone.")) {
        localStorage.clear();
        location.reload();
      }
    }
  </script>
</body>
</html>
